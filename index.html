<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOTL LEAGUE X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507;
    --green:#3ddc84;
    --ink:#f4f4f2;
    --dim:#8b8b93;
    --edge: clamp(16px, 4vw, 40px);
    --logo-size: max(15em, 40dvw);
    --logo-gap: 2em;
    --clock-height: 3em;
    --clock-gap: 2em;
  }
  
    /* mobile: translucent strip pinned to the bottom */
  @media (max-width:630px){
    :root{
     --logo-size: max(15em, 90dvw);

    }
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{
    width:100dvw; height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
  }
  body{
    color:var(--ink);
    font-family:'Space Mono', monospace;
    position:relative;
  }

  /* ---- starfield (fixed, animated drift) ---- */
  #stars{
    position:fixed; inset:-4% ;
    z-index:0;
    animation:drift 60s linear infinite;
    will-change:transform;
  }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; }
  @keyframes drift{
    0%{ transform:translate(0,0); }
    50%{ transform:translate(-1.2%, 1%); }
    100%{ transform:translate(0,0); }
  }
  .star.twinkle{ animation:twinkle 3.5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:var(--o,0.5);} 50%{ opacity:calc(var(--o,0.5)*0.25); } }

  /* ---- fixed brand mark, always top-left ---- */
  .brand{
    position:fixed;
    top:var(--edge); left:var(--edge);
    width:var(--logo-size);
    z-index:10;
  }
  .brand img{ width:100%; display:block; }

  /* ---- fixed nav, top-right ---- */
  nav{
    position:fixed;
    top:calc(var(--edge) + 6px); right:var(--edge);
    z-index:10;
    display:flex;
    gap:clamp(16px,3vw,32px);
  }
  @media (max-width:860px){
    nav{ flex-direction:column; align-items:flex-end; gap:10px; }
  }
  nav a{ color:var(--ink); text-decoration:none; font-size:0.85rem; }
  nav a:hover{ color:var(--green); }
  nav a:focus-visible{ outline:2px solid var(--green); outline-offset:4px; }

  /* ---- photo layer ---- */
  .art{
    position:fixed;
    z-index:1;
    overflow:hidden;
    will-change:transform;
  }
  .art img{
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(1) contrast(1.15) brightness(0.95);
    mix-blend-mode:screen;
  }
  /* desktop: right-hand panel */
  @media (min-width:861px){
    .art{ top:0; right:0; width:44%; height:100%; }
    .art img{ opacity:0.32; }
  }
  /* mobile: translucent strip pinned to the bottom */
  @media (max-width:860px){
    .art{ left:0; bottom:0; width:100%; height:70dvh; }
    .art img{ opacity:0.22; object-position:50% 0%; }
  }

  /* ---- content ---- */
  .content{
    position:relative; z-index:2;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:
      calc(var(--edge) + var(--logo-size) + var(--logo-gap))
      var(--edge)
      calc(var(--edge) + var(--clock-height) + var(--clock-gap));
  }
  @media (max-width:860px){
    .content{ padding-bottom:calc(38dvh + var(--edge) + var(--clock-height) + var(--clock-gap)); }
  }

  #countdown{
    display:flex;
    gap:clamp(4px, 1.6vw, 14px);
    align-items:flex-start;
    font-family:'Space Mono', monospace;
    font-weight:700;
  }
  .unit{ display:flex; flex-direction:column; align-items:center; width:clamp(52px, 9vw, 78px); }
  .num{ font-size:clamp(2.2rem, 7vw, 3.6rem); font-variant-numeric:tabular-nums; line-height:1; }
  .unit-label{ margin-top:8px; font-size:0.78rem; color:var(--green); letter-spacing:0.03em; }
  .colon{ font-size:clamp(2.2rem, 7vw, 3.6rem); color:var(--dim); line-height:1; align-self:flex-start; }

  .clock{
    position:fixed;
    bottom:var(--edge); left:var(--edge);
    z-index:10;
    font-size:0.8rem; color:var(--dim); line-height:1.6;
  }
  .clock b{ color:var(--ink); display:block; font-size:0.92rem; }

  #reveal{ display:none; }
  .cta{
    display:inline-block; margin-top:0;
    background:var(--green); color:#050507;
    text-decoration:none; font-family:'Space Mono', monospace;
    font-weight:700; font-size:0.95rem;
    padding:14px 30px; border-radius:4px;
    transition:transform 0.15s ease;
  }
  .cta:hover{ transform:translateY(-2px); }
  .cta:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    #stars, .star.twinkle{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<a class="brand" href="#"><img src="assets/KotL_League-Logo.svg" alt="KOTL League"></a>


<div class="art"><img id="hero-photo" src="assets/prima.png" alt=""></div>

<div class="content">
  <div id="before">
    <div id="countdown">
      <div class="unit"><span class="num" id="d">00</span><span class="unit-label">DAYS</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="h">00</span><span class="unit-label">HRS</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="m">00</span><span class="unit-label">MIN</span></div>
      <span class="colon">:</span>
      <div class="unit"><span class="num" id="s">00</span><span class="unit-label">SEC</span></div>
    </div>
  </div>

  <div id="reveal">
    <a class="cta" id="join-link" href="#" target="_blank" rel="noopener">Join the league</a>
  </div>
</div>

<div class="clock">CURRENT TIME<b id="now">--</b></div>

<script>
  // ---- CONFIGURE THESE ----
  const TARGET_DATE = new Date('2026-10-06T10:15:00-04:00');
  const JOIN_LINK = 'https://app.musicleague.com/l/6fef6c5fea0641839b76adec0bb74dc1/';
  const SHAKE_WINDOW_MS = 10000; // screenshake kicks in this many ms before zero
  // --------------------------

  document.getElementById('join-link').href = JOIN_LINK;

  // starfield
  const starField = document.getElementById('stars');
  for (let i = 0; i < 160; i++){
    const s = document.createElement('div');
    const isTwinkle = Math.random() < 0.35;
    s.className = 'star' + (isTwinkle ? ' twinkle' : '');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    const o = (Math.random()*0.6 + 0.2);
    s.style.setProperty('--o', o.toFixed(2));
    s.style.opacity = o.toFixed(2);
    const size = Math.random() < 0.12 ? 3 : (Math.random() < 0.4 ? 2 : 1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    if (isTwinkle) s.style.animationDelay = (Math.random()*3.5).toFixed(2) + 's';
    starField.appendChild(s);
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function renderClock(){
    const now = new Date();
    const datePart = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('now').textContent =
      `${datePart} / ${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}${ampm}`;
  }

  // ---- screenshake (parallax: stars shake subtly, photo shakes harder, opposite phase) ----
  const starsEl = document.getElementById('stars');
  const artEl = document.querySelector('.art');
  let shakeActive = false;
  let shakeRaf = null;

  function shakeTick(){
    const diff = TARGET_DATE - new Date();
    if (diff > 0 && diff <= SHAKE_WINDOW_MS){
      const intensity = 1 - (diff / SHAKE_WINDOW_MS); // ramps 0 -> 1 as we approach zero
      const starAmp = 3 + intensity * 6;
      const artAmp = 6 + intensity * 16;
      const t = Date.now() / 1000;
      const sx = Math.sin(t * 29) * starAmp + Math.sin(t * 13.3) * starAmp * 0.4;
      const sy = Math.cos(t * 23) * starAmp * 0.6;
      const ax = -Math.sin(t * 21 + 1.4) * artAmp;
      const ay = Math.cos(t * 17 + 0.6) * artAmp * 0.5;
      starsEl.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
      artEl.style.transform = `translate(${ax.toFixed(1)}px, ${ay.toFixed(1)}px)`;
      shakeRaf = requestAnimationFrame(shakeTick);
    } else {
      starsEl.style.transform = '';
      artEl.style.transform = '';
      shakeActive = false;
      if (shakeRaf) cancelAnimationFrame(shakeRaf);
    }
  }

  function render(){
    const now = new Date();
    const diff = TARGET_DATE - now;

    if (diff <= 0){
      document.getElementById('before').style.display = 'none';
      document.getElementById('reveal').style.display = 'block';
      clearInterval(timer);
      starsEl.style.transform = '';
      artEl.style.transform = '';
      if (shakeRaf) cancelAnimationFrame(shakeRaf);
    } else {
      document.getElementById('d').textContent = pad(Math.floor(diff / 86400000));
      document.getElementById('h').textContent = pad(Math.floor((diff / 3600000) % 24));
      document.getElementById('m').textContent = pad(Math.floor((diff / 60000) % 60));
      document.getElementById('s').textContent = pad(Math.floor((diff / 1000) % 60));

      if (diff <= SHAKE_WINDOW_MS && !shakeActive){
        shakeActive = true;
        shakeTick();
      }
    }
    renderClock();
  }

  render();
  const timer = setInterval(render, 1000);
</script>

</body>
</html>
